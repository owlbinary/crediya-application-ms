server:
  port: ${SERVER_PORT:8080}

spring:
  webflux:
    base-path: /solicitud
  application:
    name: application-service
  
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1

management:
  server:
    base-path: /actuator
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
  allowed-context-path: /solicitud

validacion:
  documento:
    url: ${VALIDACION_DOCUMENTO_URL}

logging:
  level:
    com.crediya.auth: ${LOG_LEVEL_CREDIYA:INFO}
    org.springframework.r2dbc: INFO
    org.springframework.transaction: INFO
    io.r2dbc.postgresql: WARN
    reactor.netty: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

aws:
  region: ${AWS_REGION}
  sqs:
    notificaciones:
      queueUrl: ${AWS_SQS_NOTIFICACIONES_QUEUE_URL}
    capacidad-endeudamiento:
      queueUrl: ${AWS_SQS_CAPACIDAD_ENDEUDAMIENTO_QUEUE_URL}
    estado-solicitud:
      queueUrl: ${AWS_SQS_ESTADO_SOLICITUD_QUEUE_URL}